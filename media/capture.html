<!DOCTYPE html>
<!--
  Hidden video-capture controller (one per browser, invisible to the agent/tab UI).

  For each page the extension asks us to capture: getDisplayMedia grabs that tab's
  MediaStream (the tab is briefly titled with the magic string that
  --auto-select-tab-capture-source-by-title auto-approves), and the track is sent to
  that panel's webview over a direct WebRTC peer connection on loopback.

  Why WebRTC rather than shipping encoded frames through the extension host: the
  receiver becomes a real <video> element, composited natively by the editor with no
  per-frame JavaScript, no canvas blit, and no structured-clone IPC — plus WebRTC's
  own jitter buffer, frame pacing and congestion control. The extension host only
  brokers SDP/ICE; media never passes through it.

  Wire (text JSON, both directions, via the host):
    controller -> host: { pageId, kind: 'offer'|'ice', payload }
    host -> controller: { cmd: 'signal', pageId, kind: 'answer'|'ice', payload }
    host -> controller: { cmd: 'start'|'stop', pageId }
    controller -> host (binary): { pageId, kind: 'started'|'error' } for start acks
-->
<html>
<head><meta charset="utf-8"><title>cobrowser capture controller</title></head>
<body>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const PORT = params.get('port');
const TOKEN = params.get('token');

/** pageId -> { pc, track, stopped } */
const captures = new Map();
let ws;

/** Binary status frame (matches the host's [u32le headerLen][header] framing). */
function status(header) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const head = new TextEncoder().encode(JSON.stringify(header));
  const out = new Uint8Array(4 + head.length);
  new DataView(out.buffer).setUint32(0, head.length, true);
  out.set(head, 4);
  ws.send(out);
}

function signal(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

async function start(pageId) {
  if (captures.has(pageId)) return;
  const state = { stopped: false, pc: null, track: null };
  captures.set(pageId, state);
  try {
    // The target tab currently carries the magic title, so the flag auto-selects it.
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: { ideal: 60 }, width: { max: 8192 }, height: { max: 8192 } },
      audio: false,
    });
    if (state.stopped) { stream.getTracks().forEach((t) => t.stop()); return; }
    const track = stream.getVideoTracks()[0];
    state.track = track;
    track.addEventListener('ended', () => stop(pageId));

    const pc = new RTCPeerConnection({ iceServers: [] }); // loopback: host candidates only
    state.pc = pc;
    pc.addTrack(track, stream);

    // Tuned by measurement while scrolling a text-heavy page (capture 2400x1626):
    //   maintain-resolution -> 49fps   maintain-framerate -> 13fps   balanced -> 83fps
    // all at full resolution with zero dropped frames. 'balanced' wins outright; the
    // 'detail' content hint tells the encoder this is screen content (text), so it
    // spends bits on sharpness rather than smoothing. No downscaling: full res is free
    // at these rates on loopback.
    track.contentHint = 'detail';
    const sender = pc.getSenders().find((s) => s.track === track);
    if (sender) {
      const p = sender.getParameters();
      p.degradationPreference = 'balanced';
      p.encodings = [{ maxBitrate: 60_000_000, maxFramerate: 60, scaleResolutionDownBy: 1 }];
      await sender.setParameters(p).catch(() => {});
    }

    pc.onicecandidate = (e) => {
      if (e.candidate) signal({ pageId, kind: 'ice', payload: e.candidate });
    };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed') {
        status({ pageId, kind: 'error', message: 'peer connection failed' });
        stop(pageId);
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    signal({ pageId, kind: 'offer', payload: pc.localDescription });
    status({ pageId, kind: 'started' });
  } catch (err) {
    status({ pageId, kind: 'error', message: String((err && err.message) || err) });
    stop(pageId);
  }
}

async function onSignal(msg) {
  const s = captures.get(msg.pageId);
  if (!s || !s.pc) return;
  try {
    if (msg.kind === 'answer') await s.pc.setRemoteDescription(msg.payload);
    else if (msg.kind === 'ice') await s.pc.addIceCandidate(msg.payload).catch(() => {});
  } catch (err) {
    status({ pageId: msg.pageId, kind: 'error', message: 'signal: ' + err.message });
  }
}

function stop(pageId) {
  const s = captures.get(pageId);
  if (!s) return;
  s.stopped = true;
  try { if (s.track) s.track.stop(); } catch (_) {}
  try { if (s.pc) s.pc.close(); } catch (_) {}
  captures.delete(pageId);
}

function connect() {
  ws = new WebSocket('ws://127.0.0.1:' + PORT + '/capture?token=' + encodeURIComponent(TOKEN));
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch (_) { return; }
    if (m.cmd === 'start') void start(m.pageId);
    else if (m.cmd === 'stop') stop(m.pageId);
    else if (m.cmd === 'signal') void onSignal(m);
  };
  ws.onclose = () => setTimeout(connect, 1000); // host restarted — reconnect
}
connect();
</script>
</body>
</html>
