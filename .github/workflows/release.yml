name: Release

# A pushed v* tag becomes a GitHub Release carrying everything cobrowser ships:
#   - cobrowser-<version>.vsix                    the editor extension
#   - cobrowser-bridge-chrome-<version>.zip       the Chrome bridge (loaded unpacked)
#   - cobrowser-bridge-firefox-<version>.xpi      the Firefox bridge, signed by Mozilla
#   - firefox-updates.json                        where installed Firefox add-ons look for updates
# and publishes it to Open VSX (where Cursor and VSCodium install extensions from) as two
# macOS packages, Apple silicon and Intel, so no other platform is offered one it cannot run.
# It runs on macOS: the vault's Touch-ID-or-password helper is built with Xcode's Swift.
#
# Cutting one: bump package.json and both add-on manifests to the same version (npm run
# release does it), add its CHANGELOG entry, then `git tag vX.Y.Z && git push origin main vX.Y.Z`.
#
# Firefox signing needs two repository secrets, from
# https://addons.mozilla.org/developers/addon/api/key/ (the account that owns the add-on):
#   AMO_JWT_ISSUER, AMO_JWT_SECRET
# Open VSX publishing needs an access token from https://open-vsx.org (profile → Settings →
# Access Tokens) of an account in the publisher's namespace: OVSX_PAT.
# Without these the release is still made, and the run warns about what it skipped. Run this
# workflow by hand with a tag to fill in a release afterwards.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build the release for, e.g. v0.9.6'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-latest
    env:
      COBROWSER_REQUIRE_AUTH_HELPER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: The tag, the extension and both add-ons carry one version
        run: |
          v="${TAG#v}"
          for f in package.json chrome-extension/manifest.json firefox-extension/manifest.json; do
            got="$(node -p "require('./$f').version")"
            if [ "$got" != "$v" ]; then echo "::error file=$f::version $got, tag $TAG"; exit 1; fi
          done

      - name: Release notes from the CHANGELOG
        run: |
          # Outside the checkout: anything in it would be packaged into the .vsix.
          awk -v h="## ${TAG#v}" '$0 == h { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then echo "::error file=CHANGELOG.md::no \"## ${TAG#v}\" entry"; exit 1; fi

      - name: Typecheck
        run: npm run typecheck

      - name: Package the extension and the Chrome add-on
        run: |
          npm run package
          npm run package:chrome
          unzip -l cobrowser-*.vsix | grep -q 'extension/dist/app/cobrowser-auth$' || { echo "::error::the .vsix has no cobrowser-auth"; exit 1; }

      - name: Package the macOS builds for Open VSX
        run: |
          mkdir -p "$RUNNER_TEMP/targets"
          for target in darwin-arm64 darwin-x64; do
            npx vsce package --target "$target" -o "$RUNNER_TEMP/targets/"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: openvsx-packages
          path: ${{ runner.temp }}/targets/*.vsix
          if-no-files-found: error

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            *.vsix
            cobrowser-bridge-chrome-*.zip
          fail_on_unmatched_files: true

  firefox:
    name: Sign the Firefox add-on
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mozilla credentials
        id: creds
        run: |
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Firefox add-on not signed::Set the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets, then run this workflow by hand with tag $TAG."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22

      # Mozilla signs a version once, so a release that already has its .xpi is left alone
      # (re-running this workflow must not fail on it).
      - name: Sign (unlisted) and attach
        if: steps.creds.outputs.ok == 'true'
        run: |
          v="${TAG#v}"
          xpi="cobrowser-bridge-firefox-$v.xpi"
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qxF "$xpi"; then
            echo "$xpi is already on the release"
            exit 0
          fi
          npm run sign:firefox
          mv cobrowser-bridge-signed.xpi "$xpi"
          # Installed add-ons check update_url (the latest release's firefox-updates.json) daily
          # and install what it points to: this release's signed .xpi.
          node -e '
            const [tag, repo, xpi] = process.argv.slice(1);
            const id = require("./firefox-extension/manifest.json").browser_specific_settings.gecko.id;
            const update = { version: tag.slice(1), update_link: `https://github.com/${repo}/releases/download/${tag}/${xpi}` };
            console.log(JSON.stringify({ addons: { [id]: { updates: [update] } } }, null, 2));
          ' "$TAG" "$GITHUB_REPOSITORY" "$xpi" > firefox-updates.json
          gh release upload "$TAG" "$xpi" firefox-updates.json --clobber

  openvsx:
    name: Publish to Open VSX
    needs: release
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open VSX token
        id: creds
        run: |
          if [ -n "$OVSX_PAT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Not published to Open VSX::Set the OVSX_PAT repository secret, then run this workflow by hand with tag $TAG."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22

      # Built in the release job from the same commit as the release's own .vsix. A version
      # already there for a platform is left alone (Open VSX refuses repeats).
      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          name: openvsx-packages
          path: ${{ runner.temp }}/targets

      - name: Publish the macOS packages
        if: steps.creds.outputs.ok == 'true'
        run: |
          for vsix in "$RUNNER_TEMP"/targets/*.vsix; do
            read -r ns name version < <(unzip -p "$vsix" extension/package.json | node -e 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(p.publisher, p.name, p.version)')
            target="$(unzip -p "$vsix" extension.vsixmanifest | sed -n 's/.*TargetPlatform="\([^"]*\)".*/\1/p' | head -1)"
            if curl -sf -o /dev/null "https://open-vsx.org/api/$ns/$name/$target/$version"; then
              echo "$ns.$name $version ($target) is already on Open VSX"
              continue
            fi
            npx --yes ovsx@1 verify-pat "$ns" -p "$OVSX_PAT"
            npx --yes ovsx@1 publish "$vsix" -p "$OVSX_PAT"
          done

      # cobrowser runs on macOS only. Any other platform's package on Open VSX (0.9.6 went out
      # as one package for every platform) is removed, so no one is offered one that cannot run.
      # A removal that fails only warns: the release itself is already out.
      - name: Remove packages for other platforms
        if: steps.creds.outputs.ok == 'true'
        run: |
          vsix="$(ls "$RUNNER_TEMP"/targets/*.vsix | head -1)"
          read -r ns name < <(unzip -p "$vsix" extension/package.json | node -e 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(p.publisher, p.name)')
          versions="$(curl -sf "https://open-vsx.org/api/$ns/$name/versions?size=100" | node -e 'console.log(Object.keys(JSON.parse(require("fs").readFileSync(0, "utf8")).versions).join(" "))')"
          for v in $versions; do
            for target in $(curl -sf "https://open-vsx.org/api/$ns/$name/$v" | node -e 'console.log(Object.keys(JSON.parse(require("fs").readFileSync(0, "utf8")).downloads || {}).join(" "))'); do
              case "$target" in
                darwin-*) ;;
                *)
                  echo "removing $ns.$name $v ($target)"
                  # open-vsx.org cannot delete from the command line until it runs registry 1.2;
                  # until then this warns, and the version is deleted from its page by hand.
                  npx --yes ovsx@1 unpublish "$ns.$name" --versions "$v" --target "$target" --force -p "$OVSX_PAT" \
                    || echo "::warning title=Open VSX still lists $v for $target::Delete it from https://open-vsx.org/extension/$ns/$name/$v (signed in as its publisher); open-vsx.org cannot delete from the command line yet."
                  ;;
              esac
            done
          done
