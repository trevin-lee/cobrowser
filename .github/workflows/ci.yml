name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macOS: the vault's Touch-ID-or-password helper is built with Xcode's Swift, and the
    # extension only runs on macOS.
    runs-on: macos-latest
    env:
      COBROWSER_REQUIRE_AUTH_HELPER: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: cobrowser-vsix
          path: '*.vsix'
          if-no-files-found: error

  bitwarden-core:
    # cobrowser's Bitwarden core (bitwarden/, Rust): its tests and lints, and that the
    # WebAssembly committed in app/bitwarden is what this source builds (byte for byte: the
    # toolchain is pinned and build paths are remapped).
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Rust, as bitwarden/rust-toolchain.toml pins it
        working-directory: bitwarden
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy --target wasm32-unknown-unknown
          rustc --version

      - name: wasm-bindgen, at the version Cargo.lock pins
        run: cargo install wasm-bindgen-cli --locked --version "$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"/\1/p;}' bitwarden/Cargo.lock)"

      - name: Tests and lints
        working-directory: bitwarden
        run: |
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings

      - name: The committed WebAssembly is this source's
        run: |
          node scripts/build-bitwarden.mjs
          git diff --exit-code --stat app/bitwarden

  vaultwarden:
    # The Bitwarden client against a real Vaultwarden: registering two made-up accounts, one a
    # member of the other's organization, and signing in, reading and saving as the member
    # (test/vaultwarden/real-server.mjs). Linux, for the server's container.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      vaultwarden:
        image: vaultwarden/server:1.34.3
        env:
          SIGNUPS_ALLOWED: 'true'
          INVITATIONS_ALLOWED: 'true'
          DISABLE_ICON_DOWNLOAD: 'true'
        ports:
          - 8080:80
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Wait for the server
        run: for i in $(seq 1 30); do curl -fsS http://localhost:8080/alive && exit 0; sleep 2; done; exit 1

      - name: Sign in, read and save, as a member of another account's organization
        run: node test/vaultwarden/real-server.mjs
        env:
          VAULTWARDEN: http://localhost:8080

  e2e:
    # The end-to-end suites (test/e2e): each starts an isolated cobrowser app, with scratch
    # data and state dirs and no biometrics, and drives it through the real client and session
    # code; the Chrome add-on's suite runs it in Chrome for Testing. macOS runners have a
    # logged-in desktop, which the on-screen window checks need.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - run: npm ci

      - name: The app's Electron
        # Electron 44's package has no install hook: its binary is fetched by install.js.
        run: |
          npm ci --prefix app
          node app/node_modules/electron/install.js
          test -x app/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron

      - name: Chrome for Testing, for the Chrome add-on's suite
        run: npx --yes playwright@1 install chromium

      - run: npm run build

      - name: End-to-end suites
        run: npm run test:e2e
        env:
          # A runner has no GPU, so hidden tabs cost more to draw than on a Mac (12% there).
          COBROWSER_E2E_CPU_LIMIT: '30'
          # A hidden tab's screenshot: 0.3 s to 0.9 s there (600 ms on a Mac).
          COBROWSER_E2E_SHOT_LIMIT_MS: '2000'

      - name: Collect the scratch dirs (app logs, screenshots) of a failed run
        if: failure()
        run: cp -R "${TMPDIR:-/tmp}/cobrowser-e2e" e2e-scratch || true

      - name: Upload them
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-scratch
          path: e2e-scratch
          if-no-files-found: ignore
